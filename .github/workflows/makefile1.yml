# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/sophiel-meow/android_kernel_huawei_next
          kernel-dir: msm-4.4
          kernel-branch: official
          config: merge_hi3650_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 8
          disable-lto: true
          anykernel3: true
